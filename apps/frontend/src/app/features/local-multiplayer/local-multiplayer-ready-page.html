<app-entry-shell
  heading="MULTIPLAYER LOCAL"
  subtitle="GRUPO PRONTO"
  backTo="/local/multiplayer/modes"
  [scrollable]="true"
>
  <section class="group-summary" aria-labelledby="group-size">
    @if (session.selectedModeDefinition(); as mode) {
      <p class="selected-mode">
        <span>Modo selecionado</span><strong>{{ mode.name }}</strong>
      </p>
    }
    <h2 id="group-size">{{ session.playerCount() }} jogadores</h2>
    <ol>
      @for (player of session.players(); track player.id) {
        <li>
          <app-profile-avatar [avatarId]="player.avatarId" />
          <span>{{ player.name }}</span>
        </li>
      }
    </ol>
    <p>Grupo formado. A partida será implementada na próxima etapa.</p>
  </section>
</app-entry-shell>
